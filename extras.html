<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extras – Blutstrom-Saga</title>

  <style>
    :root {
      --gold: #D8B66A;
      --schwarz: #050505;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background-color: var(--schwarz);
      background-image: url("Seite%20im%20Aufbau.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--gold);
      font-family: Georgia, serif;
    }

    /* Rechte Navigation: bleibt beim Scrollen an derselben Stelle */
    .seiten-navigation {
      position: fixed;
      top: 50%;
      right: 2rem;
      transform: translateY(-50%);
      z-index: 10;

      width: 220px;
      max-height: calc(100svh - 2rem);
      overflow-y: auto;
      padding: 1rem;

      background: rgba(5, 5, 5, 0.96);
      border: 1px solid var(--gold);
      box-shadow: 0 0 18px rgba(216, 182, 106, 0.16);
    }

    .seiten-navigation a {
      display: block;
      padding: 0.45rem 0.55rem;
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(216, 182, 106, 0.2);
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .seiten-navigation a:hover,
    .seiten-navigation a:focus-visible,
    .seiten-navigation a[aria-current="page"] {
      color: #fff0bd;
      text-shadow: 0 0 8px var(--gold);
    }

    .seiten-navigation .nav-marke {
      margin-bottom: 0.5rem;
      padding-bottom: 0.8rem;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      border-bottom: 1px solid var(--gold);
    }

    .nav-trenner {
      height: 1px;
      margin: 0.7rem 0.55rem;
      background: var(--gold);
      opacity: 0.7;
      box-shadow: 0 0 6px rgba(216, 182, 106, 0.45);
    }

    /* Der Seiteninhalt liegt direkt über dem vollflächigen Hintergrundbild */
    .seitenbereich,
    .seiteninhalt {
      position: relative;
      width: 100%;
      min-height: 100svh;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .seiten-kicker {
      position: absolute;
      top: 1.5rem;
      left: 0;
      width: 100%;
      margin: 0;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 2px 10px #000;
    }

    h1 {
      position: absolute;
      top: 2.2rem;
      left: 0;
      width: 100%;
      margin: 0;
      color: var(--gold);
      font-size: clamp(2rem, 5vw, 3.5rem);
      text-align: center;
      text-shadow: 0 2px 12px #000;
    }

    .extras-mitteilung {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      margin: 0;
      padding: 0 1rem;
      transform: translateY(-50%);
      color: var(--gold);
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      line-height: 1.6;
      text-align: center;
      text-shadow: 0 2px 12px #000;
    }

    .seiten-navigation .nav-siegel {
      display: block;
      width: 4.5rem;
      height: 4.5rem;
      object-fit: contain;
      margin: 0 auto 0.5rem;
    }
  
/* ===== Blutstrom-Saga: mobile Unterseiten (automatisch ergänzt) ===== */
.mobile-menue-schalter { display: none; }
@media (max-width: 760px) {
  html { overflow-x: clip; }
  body { background-image: none !important; background-attachment: scroll !important; overflow-x: clip; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: #050505 url("Seite%20im%20Aufbau.png") center center / cover no-repeat;
    z-index: 0;
  }
  body > * { position: relative; z-index: 1; }
  .seiten-navigation {
    position: relative !important; inset: auto !important; top: auto !important; right: auto !important;
    transform: none !important; width: auto !important; max-width: none !important;
    max-height: none !important; overflow: visible !important;
    margin: 0.65rem 0.65rem 0 !important; padding: 0.55rem 0.75rem !important;
    display: flex !important; flex-wrap: wrap; align-items: center; gap: 0.4rem;
  }
  .seiten-navigation .nav-siegel { width: 2.5rem !important; height: 2.5rem !important; margin: 0 !important; }
  .seiten-navigation .nav-marke {
    display: inline-block !important; border: 0 !important; margin: 0 !important;
    padding: 0.3rem 0.4rem !important; font-size: 0.92rem !important;
    text-align: left !important; flex: 1;
  }
  .mobile-menue-schalter {
    display: inline-block; border: 1px solid var(--gold, #D8B66A);
    background: #17120b; color: var(--gold, #D8B66A);
    font: inherit; font-size: 0.85rem; padding: 0.5rem 0.65rem;
    cursor: pointer; min-height: 40px;
  }
  .seiten-navigation > a:not(.nav-marke),
  .seiten-navigation > .nav-trenner { display: none !important; }
  .seiten-navigation.mobile-offen > a:not(.nav-marke) {
    display: block !important; flex: 0 0 100%; padding: 0.55rem !important;
    font-size: 0.9rem !important;
  }
  .seiten-navigation.mobile-offen > .nav-trenner { display: block !important; flex: 0 0 100%; }
  .seitenbereich {
    width: auto !important; max-width: 100% !important;
    margin: 0.65rem !important; padding: 0 !important;
  }
  .seiteninhalt {
    width: 100% !important; max-width: 100% !important;
    min-width: 0 !important; margin: 0 !important; padding: 1rem !important;
    font-size: 14px !important; overflow-wrap: anywhere;
  }
  .seiten-kicker { font-size: 12px !important; margin-bottom: 0.4rem !important; }
  .seiteninhalt h1 { font-size: 26px !important; line-height: 1.2 !important; margin: 0 0 1.1rem !important; padding-right: 0 !important; }
  .seiteninhalt h2 { font-size: 19px !important; line-height: 1.3 !important; margin: 1.4rem 0 0.5rem !important; }
  .seiteninhalt h3 { font-size: 16px !important; line-height: 1.35 !important; }
  .seiteninhalt p, .seiteninhalt li, .seiteninhalt dd, .seiteninhalt dt,
  .seiteninhalt blockquote { font-size: 14px !important; line-height: 1.5 !important; }
  .seiteninhalt p { margin-top: 0; margin-bottom: 0.8rem; }
  .seiteninhalt img { max-width: 100%; height: auto; }
  .seiteninhalt table { display: block; max-width: 100%; overflow-x: auto; }
  .seiteninhalt pre { max-width: 100%; overflow-x: auto; }
  .seiteninhalt .seiten-siegel { position: static !important; display: block; width: 3.5rem !important; height: auto !important; max-height: 3.5rem !important; margin: 0 0 0.5rem auto !important; }
  .seiteninhalt .steckbrief { grid-template-columns: 1fr !important; }
  .seiteninhalt .buchkarte, .seiteninhalt .buchgruppe { max-width: 100%; }
  .seiteninhalt .buchkarte { grid-template-columns: 1fr !important; }
  .seiteninhalt .buchcover { max-width: min(100%, 230px) !important; height: auto !important; }
  .seiteninhalt .leitsatz { padding: 0.8rem !important; }
}
</style>
</head>

<body>
  <nav class="seiten-navigation" aria-label="Seitennavigation">
    <img class="nav-siegel" src="BS-Wappen.png" alt="BS-Siegel der Blutstrom-Saga">

    <a class="nav-marke" href="index.html">Start</a>
    <button class="mobile-menue-schalter" type="button" aria-expanded="false" aria-label="Navigation öffnen">☰ Menü</button>
    <a href="buecher.html">Bücher</a>
    <a href="charaktere.html">Charaktere</a>
    <a href="welt.html">Welt</a>
    <a href="ueber-mich.html">Über mich</a>
    <a href="blog.html">Blog</a>
    <a href="extras.html" aria-current="page">Extras</a>

    <div class="nav-trenner" aria-hidden="true"></div>

    <a href="kontakt.html">Kontakt</a>
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
  </nav>

  <div class="seitenbereich">
    <main class="seiteninhalt">
      <p class="seiten-kicker">Blutstrom-Saga</p>
      <h1>Extras</h1>

      <p class="extras-mitteilung">
        Hier gibt es noch nichts zu sehen.
      </p>
    </main>
  </div>

<script>
/* Mobile Navigation; die Desktop-Navigation bleibt unverändert. */
(function () {
  var nav = document.querySelector('.seiten-navigation');
  var button = nav && nav.querySelector('.mobile-menue-schalter');
  if (!button) return;
  button.addEventListener('click', function () {
    var open = nav.classList.toggle('mobile-offen');
    button.setAttribute('aria-expanded', String(open));
    button.textContent = open ? '✕ Menü schließen' : '☰ Menü';
  });
})();
</script>
</body>
</html>
